<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg_7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#0f1117" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#07080b" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="glow_7" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur_7" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="#0c0d12"/>
  <rect width="800" height="450" fill="url(#bg_7)"/>
  
  <!-- Glow Orb -->
  <circle cx="400" cy="180" r="220" fill="url(#glow_7)" filter="url(#blur_7)"/>
  <circle cx="680" cy="80" r="140" fill="#3b82f6" fill-opacity="0.15" filter="url(#blur_7)"/>
  <circle cx="120" cy="380" r="160" fill="#06b6d4" fill-opacity="0.12" filter="url(#blur_7)"/>

  <!-- Decorative Grid Lines -->
  <g stroke="white" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Geometry Elements -->
  <circle cx="400" cy="170" r="90" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 6" fill="none"/>
  <circle cx="400" cy="170" r="115" stroke="#3b82f6" stroke-opacity="0.15" stroke-width="1" fill="none"/>

  <!-- Center Big Game Icon -->
  <text x="400" y="195" font-size="76" text-anchor="middle" dominant-baseline="middle">🤖</text>

  <!-- Tag Pill Top Left -->
  <g transform="translate(36, 36)">
    <rect width="130" height="28" rx="14" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1"/>
    <text x="65" y="18" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle" dominant-baseline="middle">MECH ACTION</text>
  </g>

  <!-- HubIgr Branding Top Right -->
  <g transform="translate(670, 36)">
    <text x="94" y="18" fill="white" fill-opacity="0.4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="2" text-anchor="end">HUBIGR</text>
  </g>

  <!-- Title & Subtitle at Bottom Center -->
  <g transform="translate(400, 340)">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="2" text-anchor="middle" style="text-shadow: 0 4px 20px rgba(0,0,0,0.8);">MECHA PROTOCOL</text>
    <text x="0" y="32" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="4" text-anchor="middle" fill-opacity="0.9">TITAN INITIATIVE</text>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="444" width="800" height="6" fill="#06b6d4" fill-opacity="0.8"/>
</svg>